services:
  metadata_gen:
    build:
      context: .
    container_name: metadata_gen
    environment:
      - GEMINI_KEY=${GEMINI_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=logging_suggestion_db
    ports:
      - "5000:5000"
    depends_on:
      - logging_suggestion_db
    restart: unless-stopped

  logging_suggestion_db:
    image: postgres:14.23
    container_name: suggestion_logging
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data:
